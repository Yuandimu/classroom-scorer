# Streamlit Secrets 配置模板
# 将此文件复制为 .streamlit/secrets.toml（本地开发用）
# 部署到 Streamlit Cloud 时，在 Dashboard → Settings → Secrets 中配置

# DeepSeek API Key（必填，用于 AI 评分）
API_KEY = "sk-你的DeepSeek-API-Key"

# 可选：自定义 API 接口地址（默认使用 DeepSeek）
# BASE_URL = "https://api.deepseek.com/v1"

# 可选：自定义模型（默认 deepseek-chat）
# MODEL = "deepseek-chat"
